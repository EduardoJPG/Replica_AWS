<div class="inventual-dashboard-area">

    <!-- SIDEBAR -->
    <div class="inventual-dashboard-sidebar" [class.sidebar-enable]="menuSidebarActive">
        <div class="inventual-header-bar-responsive" (click)="myfunction()">
            <mat-icon>reorder</mat-icon>
        </div>

        <div class="inventual-menu-wrapper bg-white border-e border-b border-solid border-border py-10 px-7 lg:px-5 lg:py-8">
            <app-menus></app-menus>
        </div>

        <div class="inventual-menu-overlay" (click)="myfunction()" [class.sidebar-enable]="menuSidebarActive"></div>
    </div>

    <!-- MAIN -->
    <div class="inventual-dashboard-main" [class.sidebar-enable]="menuSidebarActive">

        <!-- HEADER -->
        <div class="inventual-header-area">
            <div class="inventual-header-wrapper custom-height-70 px-7 bg-white border-b border-solid border-border">
                <div class="grid grid-cols-12 items-center h-full">
                    <div class="col-span-12">
                        <app-header></app-header>
                    </div>
                </div>
            </div>
        </div>

        <!-- BREADCRUMB -->
        <div class="inventual-breadcrumb-area px-7 py-9 bg-white mb-5">
            <div class="inventual-breadcrumb-area-inner px-0.5">
                <h5 class="text-[20px] text-heading font-bold mb-3">Categorías</h5>
                <div class="inventual-breadcrumb-area-inner-wrap">
                    <span class="text-[14px] text-body me-2">Producto</span>
                    <span class="text-[14px] text-body me-2">></span>
                    <span class="text-[14px] text-body me-2">Categoría</span>
                </div>
            </div>
        </div>

        <!-- CONTENT -->
        <div class="inventual-content-area px-7">
            <div class="inventual-unit-area bg-white p-7 custom-shadow rounded-8 mb-5">

                <div class="grid grid-cols-12 gap-x-7 sm:gap-x-0">

                    <!-- FORMULARIO -->
                    <div class="col-span-3 md:col-span-12 sm:col-span-12">
                        <div class="inventual-unit-content">

                            <!-- IMAGEN -->
                            <div class="flex flex-wrap gap-5 mb-7">
                                <div class="inventual-brand-img-field">
                                    <input id="BrandImage" type="file" accept="image/*"
                                        (change)="handleFileChange($event)" class="bg-primary/5">
                                    <label for="BrandImage" class="inventual-brand-img-field-inner">
                                        {{ selectedItemCount ? 'Imagen cargada' : 'Subir imagen' }}
                                    </label>
                                </div>
                                <div class="inventual-brand-img-uploaded-wrap" #imageContainer></div>
                            </div>

                            <!-- NOMBRE -->
                            <div class="inventual-select-field mb-7">
                                <h5 class="text-[15px] font-semibold mb-3">Nombre Categoría</h5>
                                <mat-form-field class="w-full">
                                    <input matInput [(ngModel)]="nombre_categoria" placeholder="Ej: Electrónica">
                                </mat-form-field>
                            </div>

                            <!-- DESCRIPCION -->
                            <div class="inventual-select-field mb-7">
                                <h5 class="text-[15px] font-semibold mb-3">Descripción</h5>
                                <mat-form-field class="w-full">
                                    <input matInput [(ngModel)]="descripcion" placeholder="Descripción">
                                </mat-form-field>
                            </div>

                            <!-- ESTADO -->
                            <div class="inventual-select-field mb-7">
                                <h5 class="text-[15px] font-semibold mb-3">Estado</h5>
                                <mat-form-field class="w-full">
                                    <mat-select [(ngModel)]="estado">
                                        <mat-option [value]="1">Activo</mat-option>
                                        <mat-option [value]="0">Inactivo</mat-option>
                                    </mat-select>
                                </mat-form-field>
                            </div>

                            <!-- BOTON -->
                            <div class="inventual-material-btn mb-7">
                                <button mat-raised-button color="primary" (click)="crearCategoria()">
                                    Crear Categoría
                                </button>
                            </div>

                        </div>
                    </div>

                    <!-- TABLA -->
                    <div class="col-span-9 md:col-span-12 sm:col-span-12">
                        <div class="inventual-common-table">

                            <table class="!min-w-full" mat-table [dataSource]="dataSource" matSort>

                                <!-- NOMBRE -->
                                <ng-container matColumnDef="nombre_categoria">
                                    <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
                                    <td mat-cell *matCellDef="let row">{{ row.nombre_categoria }}</td>
                                </ng-container>

                                <!-- DESCRIPCION -->
                                <ng-container matColumnDef="descripcion">
                                    <th mat-header-cell *matHeaderCellDef>Descripción</th>
                                    <td mat-cell *matCellDef="let row">{{ row.descripcion }}</td>
                                </ng-container>

                                <!-- ESTADO -->
                                <ng-container matColumnDef="estado">
                                    <th mat-header-cell *matHeaderCellDef>Estado</th>
                                    <td mat-cell *matCellDef="let row">
                                        <span *ngIf="row.estado == 1">Activo</span>
                                        <span *ngIf="row.estado == 0">Inactivo</span>
                                    </td>
                                </ng-container>

                                <!-- ACCIONES -->
                                <ng-container matColumnDef="action">
                                    <th mat-header-cell *matHeaderCellDef>Acción</th>
                                    <td mat-cell *matCellDef="let row">
                                        <button mat-button color="warn"
                                            (click)="eliminarCategoria(row.id_categoria)">
                                            Eliminar
                                        </button>
                                    </td>
                                </ng-container>

                                <!-- FILAS -->
                                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

                                <!-- SIN DATOS -->
                                <tr *matNoDataRow>
                                    <td colspan="4">
                                        <div class="table-data-not-found">
                                            <p>No hay datos</p>
                                        </div>
                                    </td>
                                </tr>

                            </table>

                            <mat-paginator [pageSizeOptions]="[10, 25, 100]"></mat-paginator>

                        </div>
                    </div>

                </div>
            </div>
        </div>

        <!-- FOOTER -->
        <div class="inventual-copyright-area">
            <app-footer></app-footer>
        </div>

    </div>
</div>
