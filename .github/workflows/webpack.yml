name: Angular Build

on:
  push:
    branches: [ "main", "jorgefast79" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        working-directory: ./Front-end/Ng-Inventual
        run: npm install

      - name: Build Angular
        working-directory: ./Front-end/Ng-Inventual
        run: npm run build
